name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

env:
  CI: 'true'
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

jobs:
  build-and-release:
    name: Build & Publish GitHub Release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.15.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages and apps
        run: pnpm build

      - name: Package release artifacts
        run: |
          mkdir -p release-dist
          tar -czf release-dist/vinops-contracts-openapi.tar.gz packages/contracts/openapi
          tar -czf release-dist/vinops-architecture-docs.tar.gz docs/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-dist/vinops-contracts-openapi.tar.gz
            release-dist/vinops-architecture-docs.tar.gz
            VinOps_OpenAPI_v1_Core_Vertical_Slice.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
