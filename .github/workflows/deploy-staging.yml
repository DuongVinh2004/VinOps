name: Staging Deployment & Security Gate Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

jobs:
  verify:
    name: Monorepo Quality & Security Verification
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.0
          check-latest: false

      - name: Activate pinned pnpm version
        run: |
          corepack enable
          corepack prepare pnpm@11.15.1 --activate
          node --version
          pnpm --version

      - name: Start integration test services
        run: |
          docker compose up -d --wait --wait-timeout 120 postgres clamav
          docker compose up -d minio
          docker compose up minio-init
          docker compose ps

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Run comprehensive verification pipeline
        run: pnpm verify

      - name: Verify zero high/critical dependency advisories
        run: pnpm audit --audit-level high

      - name: Stop integration test services
        if: always()
        run: docker compose down -v

  build-images:
    name: Build Multi-stage Production Docker Images
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3

      - name: Build API image
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6
        with:
          context: .
          file: docker/api.Dockerfile
          push: false
          tags: vinops/api:staging-latest
          load: true

      - name: Build Worker image
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6
        with:
          context: .
          file: docker/worker.Dockerfile
          push: false
          tags: vinops/worker:staging-latest
          load: true

      - name: Build Web client image
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6
        with:
          context: .
          file: docker/web.Dockerfile
          push: false
          tags: vinops/web:staging-latest
          load: true

  security-scan:
    name: Container Image Vulnerability Scan
    needs: build-images
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3

      - name: Build API for scanning
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6
        with:
          context: .
          file: docker/api.Dockerfile
          push: false
          tags: vinops/api:scan-target
          load: true

      - name: Scan API Image with Trivy
        uses: aquasecurity/trivy-action@5665893d9804eb58957e1be5ddff8ff0ebfa9c8b # v0.34.0
        with:
          image-ref: vinops/api:scan-target
          format: table
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

  deploy-staging:
    name: Deploy to Staging Environment
    needs: [build-images, security-scan]
    runs-on: ubuntu-24.04
    environment: staging
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1

      - name: Validate Docker Compose Configuration
        run: docker compose -f docker-compose.prod.yml config

      - name: Execute Staging Rollout Hook
        run: |
          echo "Staging deployment target verified."
          echo "Pipeline passed: quality verification, audit, multi-stage image build, and security scanning."
