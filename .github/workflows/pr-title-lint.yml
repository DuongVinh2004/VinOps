name: PR Title Lint

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  validate-title:
    name: Validate Conventional Commit Title
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check PR Title against Conventional Commits
        run: |
          TITLE="${{ github.event.pull_request.title }}"
          echo "Inspecting Pull Request title: $TITLE"
          PATTERN="^((feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-zA-Z0-9_.-]+\))?: .+|Bump .+|Update .+)"
          if [[ ! "$TITLE" =~ $PATTERN ]]; then
            echo "::error title=Invalid PR Title::Pull Request title does not match Conventional Commits format."
            echo "Examples of valid titles:"
            echo "  - feat(bim): support IFC 4.3 spatial hierarchy"
            echo "  - fix(auth): prevent race condition in refresh token rotation"
            echo "  - chore(deps): upgrade dependencies"
            echo "  - docs(readme): update deployment topology diagram"
            exit 1
          fi
          echo "Pull Request title adheres to Conventional Commits specification."
