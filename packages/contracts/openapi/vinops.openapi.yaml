components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived access token stored in memory only.
    refreshCookie:
      type: apiKey
      in: cookie
      name: vinops_refresh
      description: Opaque rotated credential. Cookie is Secure, HttpOnly, SameSite=Lax, host-only, Path=/api/v1/auth; idle TTL defaults to 7 days and absolute TTL to 30 days. Never log its value.
  parameters:
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DocumentId:
      name: documentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RevisionId:
      name: revisionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UploadSessionId:
      name: uploadSessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ContextImportId:
      name: importId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BreakGlassRequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IssueId:
      name: issueId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RfiId:
      name: rfiId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SubmittalId:
      name: submittalId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProjectContextKind:
      name: kind
      in: path
      required: true
      schema:
        type: string
        enum:
          - partner
          - calendar
          - numbering_profile
          - location_node
          - work_node
          - discipline
          - classification
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: Same key and payload returns the canonical result; reuse with a different payload is rejected.
    CsrfHeader:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 32
      description: Session-bound token kept in browser memory. Cookie-authenticated mutations also require exact Origin allowlist validation, with appropriate Referer fallback.
  headers:
    CorrelationId:
      description: End-to-end request correlation identifier returned on every response, including errors and 204 responses.
      schema:
        type: string
        format: uuid
    RefreshSetCookie:
      description: Sets the rotated refresh credential; host-only with no Domain attribute.
      schema:
        type: string
        example: vinops_refresh=opaque; Path=/api/v1/auth; HttpOnly; Secure; SameSite=Lax
    ExpiredRefreshSetCookie:
      description: Expires the current refresh cookie using the same name, path and security attributes.
      schema:
        type: string
        example: vinops_refresh=; Max-Age=0; Path=/api/v1/auth; HttpOnly; Secure; SameSite=Lax
    AuthCacheControl:
      description: Prevents caching authentication credentials and responses.
      schema:
        type: string
        const: no-store
    RetryAfter:
      description: Delay in seconds before a safe or idempotency-protected retry.
      schema:
        type: integer
        minimum: 1
  responses:
    BadRequest:
      description: Malformed request
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Authentication required or session revoked
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Visible resource but action, state, scope or separation-of-duty denied
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: State, concurrency or idempotency conflict
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
    Validation:
      description: Semantic validation failed
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: Rate limit exceeded
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
    ResourceNotVisible:
      description: Resource does not exist or must not be revealed across tenant, membership or visibility boundaries
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: RESOURCE_NOT_VISIBLE
            message_key: errors.resourceNotVisible
            correlation_id: 123e4567-e89b-42d3-a456-426614174000
            retryable: false
    DependencyUnavailable:
      description: A required dependency is unavailable; clients must not blindly retry non-idempotent mutations
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: DEPENDENCY_UNAVAILABLE
            message_key: errors.dependencyUnavailable
            correlation_id: 123e4567-e89b-42d3-a456-426614174000
            retryable: true
  schemas:
    Error:
      type: object
      required:
        - code
        - message_key
        - correlation_id
        - retryable
      properties:
        code:
          type: string
          example: PERMISSION_DENIED
        message_key:
          type: string
          example: errors.permissionDenied
        details:
          type: object
          additionalProperties: true
        correlation_id:
          type: string
          format: uuid
        retryable:
          type: boolean
    SessionCreate:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
        device_name:
          type: string
          maxLength: 120
    Session:
      type: object
      required:
        - access_token
        - access_token_expires_at
        - session_id
        - user
      properties:
        access_token:
          type: string
          description: Bearer token kept in browser memory only; default TTL is 15 minutes and is configurable. Never persist in localStorage, sessionStorage or IndexedDB.
        access_token_expires_at:
          type: string
          format: date-time
        session_id:
          type: string
          format: uuid
        csrf_token:
          type: string
          description: Returned for cookie-authenticated refresh/logout requests.
        user:
          $ref: '#/components/schemas/UserSummary'
    UserSummary:
      type: object
      required:
        - id
        - display_name
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
        email:
          type: string
          format: email
    Acknowledgement:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          const: accepted
    PasswordResetRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
    PasswordResetConfirm:
      type: object
      required:
        - token
        - password
      properties:
        token:
          type: string
          minLength: 32
          description: Opaque single-use credential. It is never returned, logged, or stored in clear text.
        password:
          type: string
          format: password
          minLength: 12
    OrganizationCreate:
      type: object
      required:
        - code
        - name
      properties:
        code:
          type: string
          pattern: ^[A-Z0-9][A-Z0-9_-]{1,31}$
        name:
          type: string
          minLength: 2
          maxLength: 200
    Organization:
      type: object
      required:
        - id
        - code
        - name
        - status
        - version
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        status:
          type: string
          enum:
            - Active
            - Suspended
            - Archived
        version:
          type: integer
          format: int64
          minimum: 1
    OrganizationList:
      type: object
      required:
        - items
        - page
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Organization'
        page:
          $ref: '#/components/schemas/PageMeta'
    OrganizationMembershipCreate:
      type: object
      required:
        - user_id
        - roles
      properties:
        user_id:
          type: string
          format: uuid
        roles:
          type: array
          minItems: 1
          items:
            type: string
        valid_from:
          type: string
          format: date-time
        valid_to:
          type: string
          format: date-time
    OrganizationMembership:
      type: object
      required:
        - id
        - user_id
        - roles
        - status
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        display_name:
          type: string
        roles:
          type: array
          items:
            type: string
        status:
          type: string
          enum:
            - Active
            - Suspended
            - Ended
        valid_from:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        valid_to:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        version:
          type: integer
          format: int64
          minimum: 1
    OrganizationMembershipList:
      type: object
      required:
        - items
        - page
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrganizationMembership'
        page:
          $ref: '#/components/schemas/PageMeta'
    ProjectCreate:
      type: object
      required:
        - code
        - name
        - timezone
      properties:
        code:
          type: string
          pattern: ^[A-Z0-9][A-Z0-9_-]{1,31}$
        name:
          type: string
          minLength: 2
          maxLength: 200
        timezone:
          type: string
          example: Asia/Bangkok
        calendar_profile_id:
          type: string
          format: uuid
        numbering_profile_id:
          type: string
          format: uuid
    ProjectTransition:
      type: object
      required:
        - action
        - expected_version
      properties:
        action:
          type: string
          enum:
            - activate
            - suspend
            - resume
            - start_archive
            - complete_archive
            - restore
