openapi: 3.1.0
info:
  title: VinOps API - Core Vertical Slice
  version: 1.1.0
  license:
    name: Proprietary - VinOps internal project artifact
    identifier: LicenseRef-Proprietary
  description: >-
    Executable contract for the VIN-MEGA-001 platform foundation and VIN-MEGA-002 Document Control vertical slice.
    Tenant, project, action and resource scope are derived and verified server-side; client identifiers never grant
    access. Current revision is an explicit context pointer changed only by an atomic authorized publication.
  x-vinops-cr-002:
    effective_date: '2026-07-30'
    access_token:
      default_ttl_minutes: 15
      storage: browser-memory-only
      cache_control: no-store
    refresh_credential:
      storage: hashed-server-representation
      rotation: every-refresh
      reuse_response: revoke-session-family-and-emit-security-audit-signal
      default_idle_ttl_days: 7
      default_absolute_ttl_days: 30
    csrf:
      required_for: cookie-authenticated-mutations
      token_binding: session-and-browser-memory
      origin_check: exact-allowlist-with-referer-fallback
    cors:
      origins: exact-environment-allowlist
      credentials_with_wildcard: forbidden
      production_localhost_or_null_default: forbidden
  x-vinops-response-invariants:
    correlation_id: Every response, including errors and 204 responses, returns X-Correlation-ID and any problem body repeats it as correlation_id.
    error_shape: application/problem+json uses code, message_key, optional safe details, correlation_id, and retryable; no credential, token, or cross-tenant metadata is exposed.
    mutation: Material tenant/project domain commands require an Idempotency-Key; Mega-001 versioned commands carry expected_version in their envelope, while credential operations use their dedicated rotation, single-use, or revocation semantics. Retained Candidate endpoints may use If-Match.
    pagination: Cursor pagination uses an opaque cursor, page_size in the inclusive range 1..100, and PageMeta.has_more.
servers:
  - url: https://api.staging.vinops.example/api/v1
    description: Staging placeholder; replace through environment configuration.
tags:
  - name: Auth
    description: Authentication, password reset, rotating refresh credentials, and session revocation.
  - name: Organizations
    description: Tenant bootstrap and organization membership; organization identifiers never confer access.
  - name: Projects
    description: Project provisioning, listing and lifecycle transitions.
  - name: Membership
    description: Invitations, project membership, roles and resource scope.
  - name: Delegation
    description: Time-bounded delegated authority under a project scope.
  - name: BreakGlass
    description: Reasoned, approved, time-bounded emergency access with an auditable banner signal.
  - name: ProjectContext
    description: Project-local metadata, partner metadata, calendars, numbering, LBS/WBS, disciplines, classifications, and CSV import.
  - name: Documents
    description: Stable document containers and authorized search/detail.
  - name: Revisions
    description: Business revisions, review decisions and atomic publish.
  - name: Files
    description: Staged upload completion and short-lived authorized download.
  - name: Review
    description: Immutable review assignments, comments, dispositions and decisions.
  - name: Transmittals
    description: Immutable controlled-distribution snapshots.
  - name: Audit
    description: Redacted audit timeline under the caller's resource scope.
  - name: FieldIssues
    description: Field issue quick-create, triage, lifecycle, and comments.
  - name: RFI
    description: Request for information lifecycle, official response pipeline, and SLA tracking.
  - name: Submittals
    description: Submittal review engine, material samples, and shop drawings.
security:
  - bearerAuth: []
paths:
  /auth/sessions:
    post:
      operationId: createSession
      tags:
        - Auth
      summary: Authenticate and create a session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionCreate'
      responses:
        '200':
          description: Success
          headers:
            Set-Cookie:
              $ref: '#/components/headers/RefreshSetCookie'
            Cache-Control:
              $ref: '#/components/headers/AuthCacheControl'
            X-Correlation-ID:
              description: End-to-end request correlation identifier.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
    delete:
      operationId: revokeAllSessions
      tags:
        - Auth
      summary: Revoke every session in the authenticated user's refresh-token families
      responses:
        '204':
          description: All sessions revoked
          headers:
            Set-Cookie:
              $ref: '#/components/headers/ExpiredRefreshSetCookie'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /auth/refresh:
    post:
      operationId: refreshSession
      tags:
        - Auth
      summary: Rotate the HttpOnly refresh credential and issue a short-lived access token
      security:
        - refreshCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          description: Success
          headers:
            Set-Cookie:
              $ref: '#/components/headers/RefreshSetCookie'
            Cache-Control:
              $ref: '#/components/headers/AuthCacheControl'
            X-Correlation-ID:
              description: End-to-end request correlation identifier.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /auth/sessions/{sessionId}:
    delete:
      operationId: revokeSession
      tags:
        - Auth
      summary: Revoke one session
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '204':
          description: Session revoked
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation'
        '404':
          $ref: '#/components/responses/ResourceNotVisible'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /auth/password-resets:
    post:
      operationId: requestPasswordReset
      tags:
        - Auth
      summary: Accept a password-reset request without revealing whether the account exists
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '202':
          description: Request accepted. The response is intentionally indistinguishable for existing and unknown accounts.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Acknowledgement'
        '422':
          $ref: '#/components/responses/Validation'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /auth/password-resets/confirm:
    post:
      operationId: confirmPasswordReset
      tags:
        - Auth
      summary: Consume one short-lived password-reset credential and revoke affected sessions
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
      responses:
        '204':
          description: Password reset accepted; the opaque reset credential can never be used again.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /organizations:
    get:
      operationId: listOrganizations
      tags:
        - Organizations
      summary: List organizations visible to the authenticated user
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Tenant-safe visible organization page
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
    post:
      operationId: createOrganization
      tags:
        - Organizations
      summary: Bootstrap an organization only when the server grants the required platform entitlement
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationCreate'
      responses:
        '201':
          description: Organization created with its creating user as an organization owner
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /organizations/{organizationId}/members:
    get:
      operationId: listOrganizationMembers
      tags:
        - Organizations
      summary: List organization membership within the caller's authorized tenant view
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Organization membership page
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationMembershipList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotVisible'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
    post:
      operationId: createOrganizationMembership
      tags:
        - Organizations
      summary: Add an organization member without granting project access
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationMembershipCreate'
      responses:
        '201':
          description: Organization membership created
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationMembership'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotVisible'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /organizations/{organizationId}/projects:
    get:
      operationId: listProjects
      tags:
        - Projects
      summary: List projects visible to the caller
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Success
          headers:
            X-Correlation-ID:
              description: End-to-end request correlation identifier.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation'
    post:
      operationId: createProject
      tags:
        - Projects
      summary: Create a project in Setup state
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
      responses:
        '201':
          description: Project created
          headers:
            X-Correlation-ID:
              description: End-to-end request correlation identifier.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation'
  /projects/{projectId}:
    get:
      operationId: getProject
      tags:
        - Projects
      summary: Return one project only when it is visible through effective tenant and project membership
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Project detail visible through the caller's effective tenant and project membership
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ResourceNotVisible'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /projects/{projectId}/transitions:
    post:
      operationId: transitionProject
      tags:
        - Projects
      summary: Execute a state-aware project command
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectTransition'
      responses:
        '200':
          description: Success
          headers:
            X-Correlation-ID:
              description: End-to-end request correlation identifier.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation'
        '404':
          $ref: '#/components/responses/ResourceNotVisible'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /projects/{projectId}/invitations:
    post:
      operationId: createInvitation
      tags:
        - Membership
      summary: Invite an internal member or project guest
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationCreate'
      responses:
        '201':
          description: Success
          headers:
            X-Correlation-ID:
              description: End-to-end request correlation identifier.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation'
  /invitations/{token}/accept:
    post:
      operationId: acceptInvitation
      tags:
        - Membership
      summary: Accept a valid invitation
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
            minLength: 32
      responses:
        '200':
          description: Success
          headers:
            X-Correlation-ID:
              description: End-to-end request correlation identifier.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectMembership'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation'
        '404':
          $ref: '#/components/responses/ResourceNotVisible'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /projects/{projectId}/invitations/{invitationId}:
    delete:
      operationId: revokeInvitation
      tags:
        - Membership
      summary: Revoke a pending invitation without revealing inaccessible project metadata
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: invitationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Invitation revoked when it was pending and visible to the caller
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotVisible'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /projects/{projectId}/members:
    get:
      operationId: listProjectMembers
      tags:
        - Membership
      summary: List project memberships within caller scope
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Success
          headers:
            X-Correlation-ID:
              description: End-to-end request correlation identifier.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation'
  /project-members/{membershipId}:
    patch:
      operationId: updateProjectMembership
      tags:
        - Membership
      summary: Change role, scope or lifecycle with separation-of-duty checks
      parameters:
        - name: membershipId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MembershipUpdate'
      responses:
        '200':
          description: Success
          headers:
            X-Correlation-ID:
              description: End-to-end request correlation identifier.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectMembership'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation'
        '404':
          $ref: '#/components/responses/ResourceNotVisible'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /projects/{projectId}/context:
    get:
      operationId: getProjectContext
      tags:
        - ProjectContext
      summary: Read all project-local context collections permitted by the caller's effective scope
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Project metadata and Project Context collections
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectContext'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ResourceNotVisible'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /projects/{projectId}/context/{kind}:
    post:
      operationId: createProjectContextEntity
      tags:
        - ProjectContext
      summary: Create one Project Context entity selected by kind
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/ProjectContextKind'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContextEntityCreate'
      responses:
        '201':
          description: Context entity created. Partner ownership remains metadata and never grants authorization.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectContextEntity'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotVisible'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /projects/{projectId}/context-imports/preview:
    post:
      operationId: previewProjectContextImport
      tags:
        - ProjectContext
      summary: Validate an LBS or WBS CSV import without mutating project records
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContextImportPreviewRequest'
      responses:
        '201':
          description: Deterministic import preview retained for a retry-safe commit
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextImportPreview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotVisible'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /projects/{projectId}/context-imports/{importId}/commit:
    post:
      operationId: commitProjectContextImport
      tags:
        - ProjectContext
      summary: Commit a validated Project Context import once; retry returns the canonical outcome
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/ContextImportId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Import committed or canonical prior result returned
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextImportCommitResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotVisible'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /projects/{projectId}/delegations:
    post:
      operationId: createDelegation
      tags:
        - Delegation
      summary: Create an auditable bounded delegation that never outlives valid_to
      parameters:
