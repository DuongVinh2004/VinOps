services:
  postgres:
    image: postgres:17
    container_name: vinops-prod-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fixture-vinops-password}
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - vinops-prod-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vinops-prod-network

  clamav:
    image: clamav/clamav:stable_base
    container_name: vinops-prod-clamav
    restart: unless-stopped
    ports:
      - '3310:3310'
    environment:
      CLAMAV_NO_FRESHCLAMD: 'true'
    healthcheck:
      test: ['CMD-SHELL', 'clamdscan --version || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vinops-prod-network

  minio:
    image: minio/minio:latest
    container_name: vinops-prod-minio
    restart: unless-stopped
    ports:
      - '9000:9000'
      - '9001:9001'
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-fixture-minio-admin-password}
    volumes:
      - vinops-prod-minio-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'mc --version || exit 0']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vinops-prod-network

  minio-init:
    image: minio/mc:latest
    container_name: vinops-prod-minio-init
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      sleep 2;
      /usr/bin/mc alias set local http://minio:9000 minioadmin fixture-minio-admin-password;
      /usr/bin/mc mb --ignore-existing local/vinops-files;
      exit 0;
      "
    networks:
      - vinops-prod-network

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: vinops-prod-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      clamav:
        condition: service_started
      minio:
        condition: service_started
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      VINOPS_LOG_LEVEL: ${VINOPS_LOG_LEVEL:-info}
      VINOPS_API_HOST: 0.0.0.0
      VINOPS_API_PORT: 3000
      VINOPS_DATABASE_URL: ${VINOPS_DATABASE_URL:-postgresql://vinops_app_user:fixture-vinops-password@postgres:5432/vinops}
      VINOPS_AUTH_TOKEN_SECRET: ${VINOPS_AUTH_TOKEN_SECRET:-fixture-production-secret-token-32chars}
      VINOPS_ALLOWED_ORIGINS: ${VINOPS_ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1,http://web}
      VINOPS_ACCESS_TOKEN_TTL_SECONDS: 900
      VINOPS_REFRESH_IDLE_TTL_DAYS: 7
      VINOPS_REFRESH_ABSOLUTE_TTL_DAYS: 30
      VINOPS_AUTH_RATE_LIMIT_WINDOW_SECONDS: 900
      VINOPS_AUTH_RATE_LIMIT_MAX_ATTEMPTS: 5
      VINOPS_REFRESH_COOKIE_SECURE: 'false'
      VINOPS_S3_ENDPOINT: http://minio:9000
      VINOPS_S3_REGION: us-east-1
      VINOPS_S3_BUCKET: vinops-files
      VINOPS_S3_ACCESS_KEY_ID: ${VINOPS_S3_ACCESS_KEY_ID:-minioadmin}
      VINOPS_S3_SECRET_ACCESS_KEY: ${VINOPS_S3_SECRET_ACCESS_KEY:-fixture-minio-admin-password}
      VINOPS_SIGNED_URL_TTL_SECONDS: 60
      VINOPS_CLAMAV_HOST: clamav
      VINOPS_CLAMAV_PORT: 3310
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/health/live || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - vinops-prod-network

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    container_name: vinops-prod-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      clamav:
        condition: service_started
      minio:
        condition: service_started
    environment:
      NODE_ENV: production
      VINOPS_LOG_LEVEL: ${VINOPS_LOG_LEVEL:-info}
      VINOPS_WORKER_NAME: vinops-worker-prod
      VINOPS_DATABASE_URL: ${VINOPS_DATABASE_URL:-postgresql://vinops_worker_user:fixture-vinops-password@postgres:5432/vinops}
      VINOPS_S3_ENDPOINT: http://minio:9000
      VINOPS_S3_REGION: us-east-1
      VINOPS_S3_BUCKET: vinops-files
      VINOPS_S3_ACCESS_KEY_ID: ${VINOPS_S3_ACCESS_KEY_ID:-minioadmin}
      VINOPS_S3_SECRET_ACCESS_KEY: ${VINOPS_S3_SECRET_ACCESS_KEY:-fixture-minio-admin-password}
      VINOPS_CLAMAV_HOST: clamav
      VINOPS_CLAMAV_PORT: 3310
      VINOPS_OUTBOX_POLL_INTERVAL_MS: 1000
      VINOPS_FILE_JOB_POLL_INTERVAL_MS: 1000
    networks:
      - vinops-prod-network

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    container_name: vinops-prod-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '80:80'
    healthcheck:
      test: ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://127.0.0.1:80/ || exit 1']
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - vinops-prod-network

networks:
  vinops-prod-network:
    driver: bridge

volumes:
  vinops-prod-postgres-data:
  vinops-prod-minio-data:
